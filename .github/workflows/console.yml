name: Console checks

on:
  pull_request:
    paths: ['console/**', 'scripts/**', '.github/workflows/console.yml']
  push:
    paths: ['console/**', 'scripts/**', '.github/workflows/console.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests python-dotenv markdown playwright==1.60.0
      - run: python -m compileall -q console scripts
      - run: python -m unittest console.test_regressions console.test_workflow console.test_cli_adapter console.test_progress console.test_console_features console.test_transcriber_reuse console.test_media_tools -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests python-dotenv markdown playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - run: node --check console/web/app.js
      - run: node --check console/web/task-progress.js
      - run: python -m unittest console.browser_smoke -v
